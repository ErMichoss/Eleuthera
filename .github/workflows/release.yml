# Compila el APK firmado y lo publica en Releases al subir una etiqueta vX.Y.Z.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write   # necesario para crear la release

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Recuperar el almacén de claves
        run: echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}

      # local.properties no está en el repo: se crea aquí con los secretos para que
      # build.gradle.kts lo lea igual que en local. Desaparece al terminar el workflow.
      - name: Crear local.properties con las claves de MusicBrainz
        run: |
          printf 'MUSICBRAINZ_CLIENT_ID=%s\nMUSICBRAINZ_CLIENT_SECRET=%s\n' \
            "$MB_CLIENT_ID" "$MB_CLIENT_SECRET" >> local.properties
        env:
          MB_CLIENT_ID: ${{ secrets.MUSICBRAINZ_CLIENT_ID }}
          MB_CLIENT_SECRET: ${{ secrets.MUSICBRAINZ_CLIENT_SECRET }}

      - name: Compilar APK firmado
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease
        env:
          VERSION_NAME: ${{ github.ref_name }}
          SIGNING_STORE_FILE: ${{ runner.temp }}/release.jks
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}

      - name: Renombrar
        run: cp app/build/outputs/apk/release/app-release.apk "Eleuthera-${GITHUB_REF_NAME}.apk"

      - name: Publicar release
        uses: softprops/action-gh-release@v2
        with:
          files: Eleuthera-*.apk
          generate_release_notes: true